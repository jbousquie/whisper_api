[package]
name = "whisper_api"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.47.2", features = ["full"] }
actix-web = "4.12.1"
actix-multipart = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
uuid = { version = "1.19.0", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.17"
toml = "0.9.8"
num_cpus = "1.17.0"
lazy_static = "1.5.0"
chrono = "0.4"
